async function index(){

  if(!window.JSZip)throw new Error('مكتبة JSZip لم تُحمَّل، تأكد من الاتصال بالإنترنت ثم حدّث الصفحة');

  sx.replace(/<si\b[^>]*>([\s\S]*?)<\/si>/g,(_,x)=>{ss.push(dec((x.match(/<t\b[^>]*>[\s\S]*?<\/t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,'')).join('')));return''});

}

/* one grade per student per sheet type: the latest paper (a re-attempt replaces the first one) */
function recs(onlyOk){
  const best={};
  (typeof subs!='undefined'?subs:[]).forEach(s=>{
    const k=kOf(s.s);if(!COL[k]||!s.max)return;

async function plan(onlyOk){
  const I=await index(),by={},cells={},miss=[],warn={};

}

async function build(onlyOk){

<script>
/* ===== One attempt per student per sheet (enforced on the server, Supabase table "attempts") =====
   Student: submitting a sheet consumes the attempt (entering does not). A second entry shows "go back to Dr. Mohamed Mahmoud".
   Admin: dashboard panel lists students waiting for a second attempt, with an "allow" button. */
(function(){
const SHN={ant:'شيت الحمل (Antenatal)',lab:'شيت الولادة (Labor)',post:'شيت النفاس (Postpartum)'},SHS={ant:'Ante',lab:'Labour',post:'Post'};
const hasSb=()=>typeof sb!='undefined'&&sb;

/* ---- student side ---- */
async function claim(U,k){
  try{
    if(hasSb()){
      const{data,error}=await sb.rpc('start_attempt',{p_id:String(U.id),p_name:U.n,p_grp:String(U.g),p_sheet:k});
      if(error)throw error;
      return{ok:!!(data&&data.ok)};
    }
  }catch(e){console.warn('attempt check failed, falling back to this device only',e)}
  const L=LS('ngAtt',{}),key=U.id+'|'+k;
  if(L[key])return{ok:false,local:1};
  return{ok:true,local:1};   /* entering does NOT consume the attempt; it is consumed on submit (markDone) */
}
/* attempt is consumed only when the student submits the sheet */
async function markDone(U,k,rid){
  if(!U||!k)return;
  const L=LS('ngAtt',{});L[U.id+'|'+k]=Date.now();SV('ngAtt',L);
  const job={id:String(U.id),n:U.n,g:String(U.g),k:k,rid:rid||null};
  try{
    if(!hasSb())throw new Error('no cloud');
    const{data,error}=await sb.rpc('finish_attempt',{p_id:job.id,p_name:job.n,p_grp:job.g,p_sheet:job.k,p_rid:job.rid});
    if(error)throw error;
  }catch(e){console.warn('finish_attempt failed, queued for retry',e);const q=LS('ngFinQ',[]);q.push(job);SV('ngFinQ',q)}
}
(async()=>{const q=LS('ngFinQ',[]);if(!q.length||!hasSb())return;const left=[];
  for(const j of q){try{const{error}=await sb.rpc('finish_attempt',{p_id:j.id,p_name:j.n,p_grp:j.g,p_sheet:j.k,p_rid:j.rid});if(error)throw error}catch(e){left.push(j)}}
  SV('ngFinQ',left)})();
function blocked(U,k){
  show(`<div class="card sc" dir="rtl"><h2>⛔ لا يمكنك فتح هذا الشيت</h2>
<p><b>${esc(U.n)}</b></p>
<p>هذه هي <b>المحاولة الثانية</b> لك في <b>${SHN[k]}</b>، والمسموح به محاولة واحدة فقط.</p>
<p style="font-size:1.15em"><b>يجب الرجوع إلى الدكتور محمد محمود.</b></p>
<p dir="ltr" style="opacity:.85">This is your second attempt for this sheet. Only one attempt is allowed. Please go back to Dr. Mohamed Mahmoud.</p>
<button class="g" onclick="splash()">رجوع / Back</button></div>`);
}
const _tsA=toScn;
toScn=function(){
  const U=window._stu,r=document.querySelector('[name=sh]:checked'),a=arguments,t=this;
  if(!U||!r||!cfg.active[r.value])return _tsA.apply(t,a);          /* let the original show its own alerts */

/* ---- admin side ---- */

}
window.atpF=f=>{AS.f=f;arender()};
window.atpQ=v=>{AS.q=v;table()};
window.atpR=()=>arender();
window.atpGrant=async b=>{

<script>
/* ===== Master switch: stop receiving sheets (all students) =====
   Admin: a button in the dashboard closes / reopens sheet entry for everybody, with an editable message.
   Student: pressing Next (entering a sheet) while closed shows the message and does not open the sheet.
   Stored in Supabase table "settings", row id = 'lock' (same table as the active-sheets row). */
(function(){
const DEF_MSG='تم إيقاف استلام الشيتات حالياً.\nلا يمكن الدخول للشيت الآن، برجاء الرجوع للدكتور.';

async function lkFetch(){
  if(typeof sb=='undefined'||!sb)return null;
  const{data,error}=await sb.from('settings').select('data').eq('id','lock').maybeSingle();
  if(error)return null;

function lkModal(msg){
  const o=document.getElementById('lkov');o&&o.remove();

  d.style.cssText='position:fixed;inset:0;z-index:99999;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px';

  document.body.appendChild(d);
  document.getElementById('lkok').onclick=()=>d.remove();
}
/* student side */
const _idN=idNext;
idNext=async function(){

  if(L&&L.closed){
    const b=document.getElementById('sgo');if(b)b.disabled=false;

/* admin side */
function lkRender(){

  p.innerHTML='<h2>⛔ إيقاف استلام الشيتات</h2>'
   +'<p class="mu">لما توقف الاستلام، أي طالب يضغط Next لدخول الشيت بتظهر له رسالة إن الاستلام متوقف ومش بيدخل. تقدر تفتحه تاني في أي وقت.</p>'
   +'<div style="padding:10px 14px;border-radius:10px;margin:8px 0;font-weight:700;background:'+(c?'#fee2e2':'#dcfce7')+';color:'+(c?'#991b1b':'#14532d')+'">'
   +(c?'⛔ الاستلام متوقف حالياً لجميع الطلاب':'✔ الاستلام مفتوح لجميع الطلاب')+'</div>'
   +'<label>رسالة تظهر للطالب (اختياري)</label>'
   +'<textarea id="lkmsg" dir="rtl" style="min-height:70px" placeholder="'+DEF_MSG.replace(/\n/g,' ')+'">'+String(LK.msg||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea>'
   +'<button id="lkbtn" style="background:'+(c?'#16a34a':'#dc2626')+'">'+(c?'▶ فتح استلام الشيتات':'⏹ إيقاف استلام الشيتات')+'</button> '
   +'<button class="g" id="lksave">حفظ الرسالة فقط</button>';
  document.getElementById('lkbtn').onclick=()=>lkSet(!LK.closed);
  document.getElementById('lksave').onclick=()=>lkSet(LK.closed);

async function lkSet(closed){

  const b=document.getElementById('lkbtn'),s2=document.getElementById('lksave');b&&(b.disabled=true);s2&&(s2.disabled=true);
  const{error}=await sb.from('settings').upsert({id:'lock',data:{closed:!!closed,msg:msg}});
  if(error){b&&(b.disabled=false);s2&&(s2.disabled=false);return toast('⚠ تعذّر الحفظ: '+error.message+' — تأكد إنك مسجّل دخول الأدمن من السحابة',1)}

<script>
/* ===== Capacity layer (1000+ students) =====
   admin: paged loading from the server, similarity index, lazy full-paper download, partial sync
   student: draft auto-save (male students) ===== */
var LOADED={f:0,m:0},_cur={},COUNTS=null,_simGen=0;
function cntOf(x){return COUNTS?COUNTS.filter(function(r){return r.sx==x}).reduce(function(a,r){return a+(+r.n||0)},0):subs.filter(function(s){return sxOf(s)==x}).length}
async function adminCounts(){var r=await sb.rpc('admin_counts');if(r.error)throw r.error;COUNTS=r.data||[]}
function capProg(got,tot){var e=document.getElementById('ldt');if(e)e.textContent='جارٍ تحميل الأوراق… '+got+' / '+tot}
async function adminLoad(sx,inc){
  var tot=cntOf(sx),ts=null,rid=null,got=0,out=[];
  if(inc&&_cur[sx]){ts=new Date(new Date(_cur[sx].ts).getTime()-120000).toISOString();rid='00000000-0000-0000-0000-000000000000'}else{subs=subs.filter(function(s){return sxOf(s)!=sx});_cur[sx]=null}
  for(;;){
    var r=null;
    for(var t=0;t<3;t++){r=await sb.rpc('admin_subs_page',{p_sx:sx,p_after_ts:ts,p_after_rid:rid,p_limit:200});if(!r.error)break;await new Promise(function(z){setTimeout(z,800*(t+1))})}
    if(r.error)throw r.error;
    var a=r.data||[];
    a.forEach(function(x){var d=x.d;d.rid=d.rid||x.rid;out.push(d);_sig[d.rid]=SIGF(d)});
    got+=a.length;if(a.length){var l=a[a.length-1];ts=l.ts;rid=l.rid;_cur[sx]={ts:ts,rid:rid}}
    capProg(got,tot);
    if(a.length<200)break;
  }
  var have=new Set(subs.map(function(s){return s.rid}));
  subs=subs.concat(out.filter(function(d){return !have.has(d.rid)}));
  _simGen++;LOADED[sx]=1;
}
async function capLoadAll(){if(!LOADED.f)await adminLoad('f');if(!LOADED.m)await adminLoad('m')}

/* dashboard: load the selected section on first use, then grade the opened group from the stored answers */
function defGroup(sx){var SB=subs.filter(function(s){return sxOf(s)==sx});return SB.length?SB[SB.length-1].g:''}
function gNeeds(sx,g){return subs.some(function(s){return s.srv&&!s.rc&&String(s.g)==String(g)&&sxOf(s)==sx})}
function capErr(e){show('<div class="card sc" dir="rtl"><h2 style="color:#e11">تعذّر تحميل / تصحيح الأوراق</h2><p dir="ltr">'+esc(e&&(e.message||e.code)||e)+'</p><button onclick="dash(\'\')">إعادة المحاولة</button><button class="g" onclick="splash()">خروج</button></div>')}
(function(){var _d=dash;dash=function(gr,f){var sx=window._asx||'f',t=this,a=arguments;
  if(window._chosen&&sb&&COUNTS){
    var need=!LOADED[sx],g0=gr||(need?'':defGroup(sx));
    if(need||(g0&&gNeeds(sx,g0))){
      show('<div class="card sc" dir="rtl"><div class="spin"></div><h2 id="ldt">جارٍ تحميل الأوراق…</h2><p>برجاء الانتظار.</p></div>');
      (async function(){if(need)await adminLoad(sx);var g=gr||defGroup(sx);await ensureGradedFor(sx,g);return _d.call(t,g||gr,f)})().catch(capErr);
      return}}
  return _d.apply(this,arguments)}})();

/* similarity check: inverted index, built once per load (was O(n^2) on every screen refresh) */
var _simK=null,_simM=null;
function simBuild(){var by={},res=new Map();
  subs.forEach(function(t,i){var b=shs(t);if(!b)return;(by[t.s]=by[t.s]||[]).push(i)});
  for(var sh in by){var idx=by[sh],post=new Map();
    idx.forEach(function(i){shs(subs[i]).forEach(function(g){var a=post.get(g);if(!a)post.set(g,a=[]);a.push(i)})});
    idx.forEach(function(i){var A=shs(subs[i]),cnt=new Map();
      A.forEach(function(g){var a=post.get(g);if(a.length>150)return;for(var k=0;k<a.length;k++){var j=a[k];if(j!==i)cnt.set(j,(cnt.get(j)||0)+1)}});
      var o=[];cnt.forEach(function(n,j){var t=subs[j];if(t.n===subs[i].n)return;var p=n/(A.size+shs(t).size-n);if(p>=.6)o.push({n:t.n,p:Math.round(p*100)})});
      o.sort(function(x,y){return y.p-x.p});res.set(subs[i],o)})}
  return res}
cpy=function(s){var k=subs.length+'|'+_simGen;if(_simK!==k){_simM=simBuild();_simK=k}return _simM.get(s)||[]};

/* full paper (answers, partograph, scenario) is downloaded only when really needed: PDF, answer key, AI grading */
async function hyd(s){if(!s||!s.L||!sb)return s;await cloudSync();
  var r=await sb.from('submissions').select('data').eq('rid',s.rid).maybeSingle();
  if(r.error||!r.data)throw (r.error||new Error('Paper not found'));
  Object.keys(s).forEach(function(k){delete s[k]});Object.assign(s,r.data.data);_sig[s.rid]=SIGF(s);return s}
async function hydGroup(g,sx0){var sx=sx0||window._asx||'f',need=subs.filter(function(s){return s.L&&String(s.g)==String(g)&&sxOf(s)==sx});
  if(!need.length||!sb)return;await cloudSync();var m=new Map(need.map(function(s){return[s.rid,s]}));
  var r=await sb.from('submissions').select('rid,data').eq('sx',sx).eq('grp',String(g)).limit(1000);if(r.error)throw r.error;
  (r.data||[]).forEach(function(x){var s=m.get(x.rid);if(!s)return;Object.keys(s).forEach(function(k){delete s[k]});Object.assign(s,x.data);_sig[s.rid]=SIGF(s)})}

/* ===== Grading from the stored answers (runs in the admin page only, the student's browser never grades) =====
   rebuilds the sheet in a hidden box and runs the SAME grading functions that used to run in the student's browser */
function rgBuild(s){
  var old=document.getElementById('rgbox');if(old)old.remove();
  var key=kOf(s.s),S=SH[key],A=s.ans,box=document.createElement('div');box.id='rgbox';box.style.display='none';
  S.f.forEach(function(f,i){if(f.t=='h')return;var c=A.f&&A.f[i],v=c&&c.v!=null?String(c.v):'',e=document.createElement('input');e.id='f'+i;
    if(f.t=='k'){e.type='checkbox';e.checked=(v=='Yes')}else e.value=v;box.appendChild(e)});
  S.he.forEach(function(h,i){var e=document.createElement('textarea');e.id='h'+i;var c=A.he&&A.he[i];e.value=c&&c[1]!=null?String(c[1]):'';box.appendChild(e)});
  var tb=document.createElement('table'),tbody=document.createElement('tbody');tbody.id='cpb';
  (A.cp||[]).forEach(function(r){var tr=document.createElement('tr');['cpd','cpg','cpi'].forEach(function(cl,j){var td=document.createElement('td'),t=document.createElement('textarea');t.className=cl;t.value=r&&r[j]!=null?String(r[j]):'';td.appendChild(t);tr.appendChild(td)});tbody.appendChild(tr)});
  tb.appendChild(tbody);box.appendChild(tb);
  ((A.pg&&A.pg.h)||[]).forEach(function(v){var e=document.createElement('input');e.className='phi';e.value=v;box.appendChild(e)});
  document.body.appendChild(box);return box}
function regrade(s){
  var key=kOf(s.s);if(!key||!s.ans||!s.ans.f||s.L)return false;
  var S=SH[key],A=s.ans,sx=sxOf(s),R=cfg.rub&&cfg.rub[key];
  if(!R||!R.ok||!R.json)throw new Error('no rubric for '+key);
  var sv={st:st,marks:marks,tx:tx,CPE:CPE,HEE:HEE,FR:window.FR,KN:KN,KD:KD};
  try{
    rgBuild(s);
    var typed=A.scn||'',useOff=(sx=='m')||jac(typed,R.scn)>=.5;
    st={n:s.n,g:s.g,s:key,id:s.sid||null,sx:sx,scn:useOff?R.scn:typed,key:(sx=='m'?maleKey(R.json):R.json),keyP:null,keyDone:1,mism:(sx=='m')?false:jac(typed,R.scn)<.5,ks:'ok',kb:1};
    marks=A.pg&&A.pg.m?JSON.parse(JSON.stringify(A.pg.m)):[];tx=A.pg&&A.pg.t?JSON.parse(JSON.stringify(A.pg.t)):{};
    CPE=[];HEE=[];
    var a=g1(),cp=+(gcp()/2).toFixed(2),he=+(ghe()/2).toFixed(2),pg=key=='lab'?gpg():null,tot=R5(+(a+cp+he+(pg||0)).toFixed(2)),max=S.max+5+(pg!==null?3:0);

    s.ans.mism=!!st.mism;if(sx=='m'){s.ans.cpe=CPE.slice(0,12);s.ans.hee=HEE.slice(0,8)}

async function ensureGradedFor(sx,g){
  var L=subs.filter(function(s){return s.srv&&!s.rc&&String(s.g)==String(g)&&sxOf(s)==sx});
  if(!L.length)return;
  if(!window.__vaultOK)throw new Error('مفتاح الإجابات النموذجية غير محمّل من السيرفر. سجّل الدخول من جديد أو شغّل migrate.html.');
  var e=document.getElementById('ldt');if(e)e.textContent='جارٍ تصحيح '+L.length+' ورقة…';
  await hydGroup(g,sx);
  var n=0,bad=0;L.forEach(function(s){if(s.L){bad++;return}try{if(regrade(s))n++;else bad++}catch(er){bad++;console.warn('regrade',s.rid,er)}});
  if(n)cloudSync();
  if(bad)console.warn(bad+' paper(s) could not be graded in group '+g);}
async function ensureAllGraded(){

async function submitRec(rec){if(!sb)throw new Error('no cloud');var r=await sb.rpc('submit_sheet',{p_id:String(rec.sid),p_sheet:rec.sk,p_rec:rec});if(r.error)throw r.error;return r.data||{ok:false,error:'empty reply'}}

/* ===== student draft auto-save (male students: fixed scenario, so a draft always matches the sheet) ===== */
function draftKey(){try{return(st&&st.id&&st.s&&st.sx=='m')?'draft|'+st.id+'|'+st.s:null}catch(e){return null}}
function draftCollect(){var S=SH[st.s],d={v:1,t:Date.now(),f:{},h:{},cp:[],m:null,tx:null,phi:[]};
  S.f.forEach(function(f,i){if(f.t=='h')return;var e=document.getElementById('f'+i);if(!e)return;d.f[i]=f.t=='k'?(e.checked?1:0):e.value});
  S.he.forEach(function(h,i){var e=document.getElementById('h'+i);if(e)d.h[i]=e.value});
  d.cp=[].map.call(document.querySelectorAll('#cpb tr'),function(r){return[].map.call(r.querySelectorAll('textarea'),function(t){return t.value})});
  if(st.s=='lab'){d.m=marks;d.tx=tx;d.phi=[].map.call(document.querySelectorAll('.phi'),function(i){return i.value})}
  return d}
function draftHasData(d){return Object.keys(d.f).some(function(k){return d.f[k]&&String(d.f[k]).trim()})||Object.keys(d.h).some(function(k){return String(d.h[k]).trim()})||d.cp.some(function(r){return r.some(function(x){return String(x).trim()})})||(d.m&&d.m.length)||(d.phi||[]).some(function(x){return String(x).trim()})}
function draftSave(){var k=draftKey();if(!k||!document.getElementById('cpb')||window._finBusy)return;try{var d=draftCollect();if(draftHasData(d))localStorage.setItem(k,JSON.stringify(d))}catch(e){}}
function draftClear(U,k){try{if(U&&U.id&&k)localStorage.removeItem('draft|'+U.id+'|'+k)}catch(e){}}
function draftReset(){var k=draftKey();try{k&&localStorage.removeItem(k)}catch(e){}location.reload()}
function draftRestore(){var k=draftKey();if(!k||!document.getElementById('cpb'))return;var raw=null;try{raw=localStorage.getItem(k)}catch(e){}if(!raw)return;
  var d;try{d=JSON.parse(raw)}catch(e){return}if(!d||d.v!=1||Date.now()-d.t>7*864e5)return;
  var S=SH[st.s];
  S.f.forEach(function(f,i){if(f.t=='h'||d.f[i]==null)return;var e=document.getElementById('f'+i);if(!e)return;if(f.t=='k')e.checked=!!d.f[i];else e.value=d.f[i]});
  S.he.forEach(function(h,i){var e=document.getElementById('h'+i);if(e&&d.h[i]!=null)e.value=d.h[i]});
  var need=(d.cp||[]).length;while(document.querySelectorAll('#cpb tr').length<need&&window.addRow)window.addRow();
  [].forEach.call(document.querySelectorAll('#cpb tr'),function(r,i){var a=r.querySelectorAll('textarea');(d.cp[i]||[]).forEach(function(v,j){if(a[j])a[j].value=v})});
  if(st.s=='lab'){if(d.m)marks=d.m;if(d.tx)tx=d.tx;[].forEach.call(document.querySelectorAll('.phi'),function(i,n){if(d.phi&&d.phi[n]!=null)i.value=d.phi[n]});try{draw()}catch(e){}}
  var all=[].slice.call(document.querySelectorAll('#app input,#app select,#app textarea'));
  all.forEach(function(e){if(e.type!='checkbox')e.classList.toggle('ok',!!String(e.value).trim())});
  try{pb(all.filter(function(q){return q.value.trim()}).length/Math.max(1,all.length)*100)}catch(e){}
  var a=document.getElementById('app');if(a&&!document.getElementById('draftbn'))a.insertAdjacentHTML('afterbegin','<div id="draftbn" dir="rtl" style="margin:8px 0;padding:10px 14px;border-radius:10px;background:#dcfce7;color:#14532d;border:2px solid #16a34a;font-weight:600">✔ تم استرجاع إجاباتك المحفوظة تلقائياً. <button class="g" style="width:auto;padding:3px 10px" onclick="if(confirm(\'مسح كل الإجابات والبدء من جديد؟\'))draftReset()">ابدأ من جديد</button></div>')}
(function(){var _tsC=toSheet;toSheet=async function(){var r=await _tsC.apply(this,arguments);try{draftRestore()}catch(e){console.warn('draft restore',e)}return r};

<script>
/* Announcement bar: countdown to next Thursday 17:00 (Cairo time); restarts automatically every week */
(function(){
  var TZ='Africa/Cairo',H=17,DOW=4;
  function off(t){try{var p={};new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(t)).forEach(function(x){p[x.type]=+x.value});return Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute,p.second)-Math.floor(t/1000)*1000}catch(e){return 2*36e5}}
  function nextTarget(now){
    /* first deadline: Thursday 12 Nov 2026 17:00 (Cairo), then every 7 days */
    var o=off(now),a=Date.UTC(2026,10,12,H,0,0),nw=now+o;
    var k=nw<a?0:Math.floor((nw-a)/(7*864e5))+1,tw=a+k*7*864e5;
    return tw-off(tw-o);
  }
  var tg=nextTarget(Date.now());
  function p2(n){return n<10?'0'+n:''+n}
  function tick(){
    var n=Date.now();
    if(n>=tg)tg=nextTarget(n);
    var r=Math.max(0,tg-n),s=Math.floor(r/1000);
    var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
    var a=document.getElementById('cd_d');if(!a)return;
    a.textContent=d;document.getElementById('cd_h').textContent=p2(h);document.getElementById('cd_m').textContent=p2(m);document.getElementById('cd_s').textContent=p2(c);
  }
  tick();setInterval(tick,1000);
})();
</script>
