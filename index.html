<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Obstetric Sheets</title>
<style>
:root{--bg:#f4f7fb;--c:#fff;--t:#1b2a3a;--p:#0f6e8c;--b:#d5dee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a22;--c:#1b2631;--t:#e6edf3;--b:#34475a}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:var(--bg);color:var(--t)}
.w{max-width:980px;margin:auto;padding:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin:12px 0}
h1,h2,h3{margin:.3em 0}button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer;margin:3px}button.g{background:#6b7c8c}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{font-size:13px;font-weight:600}
.miss{border:2px solid #e11!important;background:#ffe5e5!important;color:#000!important}.sc{text-align:center}.logo{width:90px;height:90px;border-radius:50%;border:2px dashed var(--p);display:flex;align-items:center;justify-content:center;margin:auto;overflow:hidden}
.logo img{width:100%}table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--b);padding:6px;text-align:left;vertical-align:top}th{background:var(--p);color:#fff}
.opt{display:block;padding:12px;border:1px solid var(--b);border-radius:10px;margin:8px 0;cursor:pointer}.opt.off{opacity:.4;pointer-events:none}.opt input{width:auto;margin-right:8px}
#pg{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:row}#tools{width:170px;padding:10px;overflow:auto;background:var(--c);border-right:1px solid var(--b)}
.tl{padding:10px;margin:6px 0;border:2px solid var(--b);border-radius:8px;text-align:center;cursor:grab;user-select:none}.tl.on{border-color:var(--p);background:#0f6e8c22}
#cv{flex:1;overflow:auto;padding:6px}canvas{background:#fff;border:1px solid #888;touch-action:none;max-width:none}
#mod{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}#mod>div{background:var(--c);padding:22px;border-radius:12px;max-width:420px;border:3px solid #e11}
.bar{height:14px;background:var(--b);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
body{background:linear-gradient(135deg,#062a3d,#0f6e8c,#6a2c91,#062a3d);background-size:400% 400%;animation:bg 20s ease infinite;background-attachment:fixed;min-height:100vh}@keyframes bg{50%{background-position:100% 50%}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}.w{position:relative;z-index:1}#pb{position:fixed;top:0;left:0;height:5px;width:0;z-index:30;background:linear-gradient(90deg,#22d3ee,#a855f7,#f43f5e);box-shadow:0 0 12px #22d3ee;transition:width .5s}
.card{background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(14px);box-shadow:0 14px 50px #0006;border-radius:18px;animation:in .7s cubic-bezier(.2,.8,.2,1) both}.grid>div,.card tr{animation:in .5s both}@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
button{background:linear-gradient(135deg,var(--p),#7b2d8e);box-shadow:0 4px 14px #0f6e8c66;transition:.2s}button:hover{transform:translateY(-2px);box-shadow:0 10px 26px #7b2d8e88}button:active{transform:scale(.95)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px #0f6e8c33}input.ok,textarea.ok,select.ok{border-color:#16a34a}
.opt{transition:.2s}.opt:hover{transform:translateX(5px)}.opt:has(input:checked){border-color:var(--p);background:#0f6e8c22;transform:scale(1.02);box-shadow:0 6px 20px #0f6e8c44}
.logo{animation:beat 1.6s infinite;box-shadow:0 0 0 0 #0f6e8c99;font-weight:700}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.13);box-shadow:0 0 0 18px #0f6e8c00}30%{transform:scale(1)}45%{transform:scale(1.07)}}
.hero h1{background:linear-gradient(90deg,var(--p),#a23bc4,#e11d48,var(--p));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}@keyframes sh{to{background-position:300%}}
.ecg{width:100%;height:60px}.ecg path{fill:none;stroke:#e11d48;stroke-width:3;stroke-linejoin:round;stroke-dasharray:500;stroke-dashoffset:500;animation:dsh 2.8s linear infinite;filter:drop-shadow(0 0 6px #e11d48)}@keyframes dsh{to{stroke-dashoffset:-500}}
#mod{animation:fd .3s}#mod>div{animation:shk .5s}@keyframes fd{from{opacity:0}}@keyframes shk{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.ring{position:relative;width:190px;margin:10px auto}.rb{fill:none;stroke:var(--b);stroke-width:12}.rf{fill:none;stroke:url(#gr);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:70px 70px;transition:stroke-dashoffset 2s cubic-bezier(.2,.8,.2,1)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}.ring small{font-size:13px;opacity:.7}.msg{font-size:22px;font-weight:700}
#c{width:100%;max-width:1000px;height:auto}#fpg{position:fixed;right:16px;bottom:16px;z-index:8;border-radius:30px;padding:12px 22px;animation:beat 1.6s infinite}
@media(max-width:700px){#qp{position:fixed;left:8px;right:8px;bottom:8px;max-width:none}#pg{flex-direction:column}#tools{width:auto;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--b);align-items:center;flex-shrink:0}#tools>b,#tools>small,#tip{display:none}.tl{min-width:104px;font-size:12px;margin:2px;padding:6px}}
.logo{width:150px;height:150px;border:4px solid #f5c518;background:#fff;box-shadow:0 8px 30px #f5c51888}
button.chip{padding:5px 10px;font-size:13px;background:#6b7c8c;box-shadow:none}button.chip.on{background:var(--p);outline:2px solid #22d3ee}#qp{position:sticky;bottom:0;z-index:12;margin-top:8px;background:var(--c);border:2px solid var(--p);border-radius:12px;padding:10px;max-width:340px;display:none;box-shadow:0 8px 30px #0006}

ant:`Marwa Ahmed is a twenty-eight-year-old university graduate who is married and currently visiting Mansoura University Main Hospital for a routine antenatal check-up at thirty-two weeks of gestation in her second pregnancy. Her family history includes maternal hypertension, while her medical history reveals mild gestational hypertension and her surgical history shows a previous Cesarean section performed two years ago due to breech presentation. She experienced menarche at age thirteen with regular twenty-eight-day cycles lasting five days, establishing her last menstrual period on February tenth, twenty-six, and her expected date of delivery on November seventeenth, twenty-six. She has one living child, no previous abortions, and previously used oral contraceptive pills for one and a half years. During this pregnancy, she occasionally reports mild frontal headaches, morning sickness, heartburn, and backache alongside normal fetal movements. Physical examination shows a blood pressure of one-hundred-thirty over eighty-five millimeters of mercury, a pulse of seventy-eight beats per minute, a temperature of thirty-seven degrees Celsius, mild lower limb edema, a longitudinal lie with cephalic presentation, and clear fetal heart sounds at one-hundred-forty-two beats per minute. Laboratory results indicate a hemoglobin level of eleven point two grams per deciliter, trace proteinuria, and reassuring fetal kick counts. The nursing care plan focuses on monitoring blood pressure to prevent gestational hypertension complications, ensuring proper positioning, and managing back pain. Comprehensive health education advises a balanced low-salt diet, personal hygiene, strict adherence to prenatal vitamins, and immediate reporting of any danger signs such as severe headaches, visual disturbances, or decreased fetal movements to Mansoura University Main Hospital.`,
lab:`Patient Name: Fatima Al-Zahraa, Age: 28 years old, Gravida/Para: G2P1, presented to the labor and delivery ward at 08:00 AM at 39 weeks of gestation complaining of regular painful uterine contractions. Her initial vital signs were stable (BP: 120/80 mmHg, Pulse: 82 bpm, Temp: 37.0°C), and abdominal examination showed a longitudinal lie, cephalic presentation, and head 4/5 palpable. Vaginal examination at 08:00 AM revealed a cervical dilatation of 3 cm, 80% effacement, intact membranes, and station -2, prompting the initiation of the partograph on the alert line with an initial Fetal Heart Rate (FHR) of 145 bpm. By 10:00 AM, contractions increased to 3 in 10 minutes, and a vaginal examination showed a dilatation of 4 cm plotted on the alert line, accompanied by spontaneous rupture of membranes (SROM) with clear amniotic fluid. At 12:00 PM (Midday), the active phase progressed with the cervix at 6 cm, 100% effacement, and station 0, while FHR remained stable at 138 bpm and contractions were strong at 4 in 10 minutes. The partograph tracked steady progress toward the action line, and IV Ringer's Lactate was maintained at 125 ml/hr. Progress continued smoothly as vaginal examination at 02:00 PM recorded an 8 cm dilatation with station +1 and clear fluid. At 03:00 PM, the cervix reached full dilatation (10 cm, station +2), marking the end of the first stage of labor on the partograph after 7 hours and 35 minutes of total labor duration. The second stage commenced immediately, and with active pushing and continuous FHR monitoring (130-140 bpm), a live, healthy baby boy was successfully delivered at 03:35 PM with Apgar scores of 8 at 1 minute and 9 at 5 minutes. The third stage was managed actively with 10 IU of Oxytocin IM, resulting in the complete delivery of the placenta and membranes at 03:50 PM. Following the repair of a second-degree perineal tear and postpartum stabilization—where maternal vitals showed a BP of 110/70 mmHg, Pulse of 78 bpm, and a firm, well-contracted uterus—the mother and newborn were safely transferred to the postnatal ward for routine monitoring`,
post:`Mariam is a 28-year-old Egyptian primary school teacher from Heliopolis, Cairo, who gave birth to her first child, a baby boy named Youssef, four weeks ago via an emergency cesarean section after a prolonged 22-hour labor. Currently navigating the intense physical and emotional challenges of the postpartum period (postpartum/post-labor), Mariam finds herself caught between modern medical advice and the heavy cultural expectations of Egyptian motherhood. Her home is constantly filled with visiting relatives, and having recently celebrated El-Sebou’, she feels an overwhelming pressure to appear joyful and grateful, which only deepens her internal struggles.
Physically, Mariam’s recovery has been exceptionally difficult. Her C-section incision remains tender, red, and occasionally throbs with sharp pain when she moves too quickly, making it hard to find a comfortable position to hold her baby. She is battling profound physical exhaustion due to a fractured sleep cycle, rarely sleeping for more than two consecutive hours. This severe fatigue is further complicated by a low and fluctuating milk supply; breastfeeding has become a painful chore that leaves her nipples cracked and sore, fueling a constant fear that Youssef is not getting enough nutrition, even though the pediatrician confirmed his weight gain is normal.
Emotionally and mentally, Mariam is experiencing a severe case of postpartum anxiety mixed with baby blues. She suffers from frequent, unprovoked crying spells—often locking herself in the bathroom to weep so her family won't see her. She is plagued by intrusive thoughts and hyper-vigilance, frequently checking if Youssef is breathing throughout the night. A significant source of her stress stems from the well-meaning but contradictory advice from her mother and mother-in-law, who are staying with her during El-Arba'een (the traditional 40-day confinement period). While they urge her to drink liters of Moghat and Halawa to boost her milk and forbid her from leaving the house, Mariam feels suffocated, experiencing a profound loss of personal identity and deep guilt for not feeling instantly connected to her new role. Her husband, though supportive, works long hours in corporate finance, leaving Mariam feeling isolated in a crowded room, desperately needing clinical validation and a structured psychological support system.`};
