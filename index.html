<script>
/* ===== Nursing Groups grade sheet: the Excel template lives inside the admin dashboard =====
   Every graded paper (Antenatal -> Ante, Labor -> Labour, Postpartum -> Post) is written into the "Sheet (15)"
   column of its own group tab. The file is built live from the current grades (rules / AI / your override),
   so it is always up to date. Only the 3 sheet cells are touched; all template formatting stays as is. */
(function(){
const COL={lab:'H',post:'K',ant:'N'},LBL={ant:'Ante',lab:'Labour',post:'Post'},MAXC=15,S=window._ng=window._ng||{only:false,g:''};
const dec=s=>String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,'&');
const norm=s=>String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[\u0623\u0625\u0622\u0671]/g,'\u0627').replace(/\u0649/g,'\u064A').replace(/\u0629/g,'\u0647').replace(/\u0624/g,'\u0648').replace(/\u0626/g,'\u064A').replace(/\s+/g,' ').trim();
let IDX=null,U8=null;
const u8=()=>U8||(U8=Uint8Array.from(atob(document.getElementById('ngTpl').textContent.trim()),c=>c.charCodeAt(0)));

/* read the template once: which row belongs to which student, in each group tab */
async function index(){
  if(IDX)return IDX;
  if(!window.JSZip)throw new Error('مكتبة JSZip لم تُحمَّل، تأكد من الاتصال بالإنترنت ثم حدّث الصفحة');
  const z=await JSZip.loadAsync(u8()),rd=p=>z.file(p).async('string');
  const wb=await rd('xl/workbook.xml'),rl=await rd('xl/_rels/workbook.xml.rels'),sx=await rd('xl/sharedStrings.xml'),ss=[];
  sx.replace(/<si\b[^>]*>([\s\S]*?)<\/si>/g,(_,x)=>{ss.push(dec((x.match(/<t\b[^>]*>[\s\S]*?<\/t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,'')).join('')));return''});
  const rel={};
  (rl.match(/<Relationship\b[^>]*>/g)||[]).forEach(t=>{const i=(t.match(/\bId="([^"]+)"/)||[])[1],g=(t.match(/\bTarget="([^"]+)"/)||[])[1];if(i&&g)rel[i]=g[0]=='/'?g.slice(1):'xl/'+g});
  const groups={},order=[];
  for(const t of (wb.match(/<sheet\b[^>]*>/g)||[])){
    const nm=dec((t.match(/\bname="([^"]*)"/)||[])[1]||''),id=(t.match(/\br:id="([^"]+)"/)||[])[1],p=rel[id];
    if(!p||!z.file(p))continue;
    const x=await rd(p),rows=[],num={};
    x.replace(/<c r="Q(\d+)"([^>]*)><v>([^<]*)<\/v><\/c>/g,(_,r,a,v)=>{num[r]=v;return''});
    x.replace(/<c r="P(\d+)"([^>]*)><v>(\d+)<\/v><\/c>/g,(_,r,a,v)=>{if(+r>=5&&/t="s"/.test(a)&&ss[+v])rows.push({r:+r,n:ss[+v],k:norm(ss[+v]),m:num[r]||''});return''});
    groups[nm.toUpperCase()]={name:nm,path:p,rows};order.push(nm.toUpperCase());
  }
  return IDX={groups,order};
}

/* one grade per student per sheet type: the latest paper (a re-attempt replaces the first one) */
function recs(onlyOk){
  const best={};
  (typeof subs!='undefined'?subs:[]).forEach(s=>{
    const k=kOf(s.s);if(!COL[k]||!s.max)return;
    const ok=!!(s.ov||s.ok);if(onlyOk&&!ok)return;
    const key=String(s.g||'').toUpperCase()+'|'+norm(s.n)+'|'+k,o=best[key];
    best[key]={s,k,ok};
  });
  return Object.values(best);
}
async function plan(onlyOk){
  const I=await index(),by={},cells={},miss=[],warn={};
  I.order.forEach(g=>{by[g]={};I.groups[g].rows.forEach(r=>{const o=by[g][r.k];if(o)o.dup=(o.dup||[o.r]).concat(r.r);else by[g][r.k]=Object.assign({},r)})});
  recs(onlyOk).forEach(({s,k,ok})=>{
    const g=String(s.g||'').toUpperCase(),row=by[g]&&by[g][norm(s.n)];
    if(!row){miss.push({n:s.n,g:s.g,s:LBL[k]});return}
    if(row.dup)warn[g+'|'+norm(s.n)]={n:s.n,g:s.g,rows:row.dup};
    const e=eff(s),v=Math.max(0,Math.min(MAXC,Math.ceil(e.tot/s.max*MAXC*2-1e-6)/2));   /* round UP to the nearest 0.5: 10.1->10.5, 10.6->11 */
    cells[g+'|'+row.r+'|'+COL[k]]={g,r:row.r,c:COL[k],v,ok,k,n:s.n};
  });
  return{cells,miss,warn:Object.values(warn)};
}

/* write the grades straight into the template XML (keeps every style, merge and the logo) */
async function build(onlyOk){
  const P=await plan(onlyOk),I=await index(),z=await JSZip.loadAsync(u8()),by={};
  Object.values(P.cells).forEach(c=>(by[c.g]=by[c.g]||[]).push(c));
  let n=0;
  for(const g in by){
    const gp=I.groups[g].path;let x=await z.file(gp).async('string');
    by[g].forEach(c=>{
      const ref=c.c+c.r,re=new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');let hit=false;
      x=x.replace(re,(_,a)=>{hit=true;return'<c r="'+ref+'"'+a.replace(/\s+t="[^"]*"/,'')+'><v>'+c.v+'</v></c>'});
      if(hit)n++;else P.miss.push({n:c.n,g:c.g,s:LBL[c.k]});
    });
    z.file(gp,x,{createFolders:false});
  }
  const blob=await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'});
  return{blob,n,miss:P.miss};
}
window._ngApi={index,plan,build,norm};

async function render(){
  try{
    const I=await index(),P=await plan(S.only),cnt={ant:0,lab:0,post:0};
    Object.values(P.cells).forEach(c=>cnt[c.k]++);
    if(!S.g||!I.groups[S.g]){const cur=((document.getElementById('grsel')||{}).value||'').toUpperCase();S.g=I.groups[cur]?cur:I.order[0]}
    const G=I.groups[S.g],total=I.order.reduce((a,g)=>a+I.groups[g].rows.length,0),box=document.getElementById('ngp');
    if(!box)return;
    box.innerHTML=`<h2>📊 شيت درجات المجموعات (Nursing Groups)</h2>
<p class="mu">كل ورقة بتتصحح بتتسجل درجتها تلقائياً في عمود <b>Sheet</b> الخاص بها داخل تبويب مجموعة الطالب: شيت الحمل ← <b>Ante</b>، شيت الولادة ← <b>Labour</b>، شيت النفاس ← <b>Post</b>. الشيت دلوقتي بيتصحح من 15 مباشرة (الأوراق القديمة اللي كانت من 20 بتتحوّل بالنسبة) وبتتقرّب لفوق لأقرب نص درجة (10.1 ← 10.5، 10.6 ← 11). أي تعديل أو اعتماد منك بيظهر في الملف فوراً.</p>
<div class="st"><div class="sc2"><big>${cnt.ant}</big>Ante</div><div class="sc2"><big>${cnt.lab}</big>Labour</div><div class="sc2"><big>${cnt.post}</big>Post</div><div class="sc2"><big>${total}</big>إجمالي الطلاب في الشيت</div></div>
<p><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" ${S.only?'checked':''} onchange="ngOnly(this.checked)"> سجّل الدرجات المعتمدة فقط (اللي اعتمدتها أو عدّلتها أنت)</label><br><small class="mu">لو مش مفعّلة بيتسجّل كل ما اتصحح (رموز ⏳ = درجة مؤقتة لسه ما اعتمدتهاش، ✔ = معتمدة).</small></p>
<p><button onclick="ngDl()">⬇ تحميل ملف Excel (كل المجموعات)</button> <span id="ngs"></span></p>
<p><label>معاينة مجموعة </label><select style="width:auto" onchange="ngSel(this.value)">${I.order.map(g=>`<option ${g==S.g?'selected':''}>${esc(I.groups[g].name)}</option>`).join('')}</select></p>
<div style="overflow:auto;max-height:340px"><table><tr><th>م</th><th>الاسم</th><th>Labour</th><th>Post</th><th>Ante</th></tr>${G.rows.map(r=>`<tr><td>${esc(r.m)}</td><td>${esc(r.n)}</td>${['lab','post','ant'].map(k=>{const c=P.cells[S.g+'|'+r.r+'|'+COL[k]];return'<td>'+(c?c.v+(c.ok?' ✔':' <small>⏳</small>'):'—')+'</td>'}).join('')}</tr>`).join('')}</table></div>
${P.warn.length?`<p style="color:#d97706;margin-top:8px">⚠ اسم مكرر داخل نفس المجموعة، الدرجة اتسجّلت في <b>أول صف</b> فقط وراجعها يدوياً: ${P.warn.map(w=>esc(w.n)+' (مجموعة '+esc(w.g)+'، صفوف '+w.rows.join(' و ')+')').join('، ')}</p>`:''}
${P.miss.length?`<details style="margin-top:8px"><summary style="color:#d97706">⚠ ${P.miss.length} ورقة لم تتطابق مع أي اسم في الشيت (لن تُسجَّل)</summary><ul>${P.miss.map(m=>`<li>${esc(m.n)} — ${esc(m.g)} — ${m.s}</li>`).join('')}</ul></details>`:''}`;
  }catch(e){const b=document.getElementById('ngp');if(b)b.innerHTML='<h2>📊 شيت درجات المجموعات (Nursing Groups)</h2><p style="color:#d97706">⚠ '+esc(e.message||e)+'</p>'}
}
window.ngSel=g=>{S.g=String(g).toUpperCase();render()};
window.ngOnly=b=>{S.only=!!b;render()};
window.ngDl=async()=>{
  const st=document.getElementById('ngs');
  try{
    st.textContent='⏳ جارٍ تجهيز الملف...';
    const R=await build(S.only);
    await dl('Nursing_Groups_Grades_'+new Date().toISOString().slice(0,10)+'.xlsx',R.blob);
    const e=document.getElementById('ngs');
    if(e)e.innerHTML='✔ تم تجهيز الملف — اتسجّلت '+R.n+' درجة'+(R.miss.length?' (و '+R.miss.length+' ورقة لم تتطابق، شوف القائمة تحت)':'');
  }catch(e){const x=document.getElementById('ngs');if(x)x.textContent='⚠ '+(e.message||e)}
};

/* mount the panel inside the admin dashboard, before the settings block */
function mount(){
  const a=document.querySelector('#app .ad');
  if(!a||document.getElementById('ngp'))return;
  const d=document.createElement('div');d.className='p';d.id='ngp';
  d.innerHTML='<h2>📊 شيت درجات المجموعات (Nursing Groups)</h2><p class="mu">⏳ جارٍ تحميل القالب...</p>';
  const det=a.querySelector('details'),host=det&&det.closest('.p');
  host&&host.parentNode===a?a.insertBefore(d,host):a.appendChild(d);
  render();
}
const _dNG=dash;
dash=function(){const r=_dNG.apply(this,arguments);try{mount()}catch(e){console.warn('grade sheet panel',e)}return r};
})();

<script>

}
(async()=>{const q=LS('ngFinQ',[]);if(!q.length||!hasSb())return;const left=[];
  for(const j of q){try{const{error}=await sb.rpc('finish_attempt',{p_id:j.id,p_name:j.n,p_grp:j.g,p_sheet:j.k,p_rid:j.rid});if(error)throw error}catch(e){left.push(j)}}

function blocked(U,k){

<p><b>${esc(U.n)}</b></p>

<script>

/* similarity check: inverted index, built once per load (was O(n^2) on every screen refresh) */

  subs.forEach(function(t,i){var b=shs(t);if(!b)return;(by[t.s]=by[t.s]||[]).push(i)});

async function submitRec(rec){if(!sb)throw new Error('no cloud');var r=await sb.rpc('submit_sheet',{p_id:String(rec.sid),p_sheet:rec.sk,p_rec:rec});if(r.error)throw r.error;return r.data||{ok:false,error:'empty reply'}}
function receipt(rec,queued){
  show('<div class="card sc" dir="rtl"><h1>✔ تم استلام ورقتك</h1><p>'+esc(rec.n)+' - Group '+esc(rec.g)+' - '+esc(rec.s)+'</p><p>رقم الإيصال: <b dir="ltr">'+esc(String(rec.rid).slice(0,8))+'</b></p>'
   +(queued?'<p style="color:#b45309;font-weight:700">⚠ الورقة اتحفظت على جهازك ولسه متبعتتش للدكتور. هتتبعت تلقائياً أول ما الإنترنت يرجع، لا تغلق الصفحة.</p>':'')
   +'<p>هتظهر نتيجتك بعد ما الدكتور يصحّح ويعتمد. تقدر تشوفها من زرار <b>"نتيجتي"</b> في الصفحة الرئيسية.</p><p dir="ltr" style="color:#555;font-size:14px">Your sheet was received. Your result appears under "My result" after the doctor confirms it.</p><button onclick="splash()">Finish</button></div>')}
fin=async function(){
  if(window._finBusy)return;window._finBusy=1;
  try{
    var S=SH[st.s],rec={rid:crypto.randomUUID(),sid:String(st.id||''),sk:st.s,s:S.n,n:st.n,g:st.g,d:new Date().toLocaleString(),ans:snapshot()};
    window._lastRid=rec.rid;
    show('<div class="card sc" dir="rtl"><div class="spin"></div><h2>جارٍ إرسال ورقتك…</h2><p>لا تغلق الصفحة</p></div>');
    var res=null;
    for(var t=0;t<3&&!res;t++){try{res=await submitRec(rec)}catch(e){console.warn('submit try '+(t+1),e);await _sleep(1500*(t+1))}}
    if(res&&(res.ok||res.dup)){try{draftClear({id:rec.sid},rec.sk)}catch(e){}window._ngOK=null;window._ngU=null;receipt(rec,0)}
    else if(res&&res.error){
      var why={'attempt used':'تم تسليم هذا الشيت من قبل ولا يمكن التسليم مرة أخرى.','sheet closed':'هذا الشيت مقفول حالياً.','unknown student':'الـ ID غير مسجل.','bad data':'بيانات الورقة غير صالحة.'}[res.error]||res.error;
      show('<div class="card sc" dir="rtl"><h2 style="color:#e11">لم يتم قبول الورقة</h2><p>'+esc(why)+'</p><p dir="ltr" style="font-size:13px;color:#555">code: '+esc(String(rec.rid).slice(0,8))+'</p><p>إجاباتك محفوظة على هذا الجهاز. تواصل مع الدكتور.</p><button onclick="splash()">رجوع</button></div>')}
    else{var q=LS('pendingSubs',[]);q.push(rec);SV('pendingSubs',q);warnCloud('no connection');receipt(rec,1)}
  }finally{window._finBusy=0}};

/* ===== Student: released results ===== */
function myRes(){show('<div class="card" dir="rtl"><h2>نتيجتي / My result</h2><label>رقم الـ ID الخاص بالكارنيه</label><input id="rid9" dir="ltr" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="8XXXXXXXX"><button onclick="myResGo()">عرض النتيجة</button><div id="rres" style="margin:12px 0;line-height:1.9"></div><button class="g" onclick="splash()">رجوع</button></div>')}
async function myResGo(){var id=_digits(document.getElementById('rid9').value),b=document.getElementById('rres');if(id.length<9){b.innerHTML='<span style="color:#dc2626">ادخل رقم الـ ID كامل</span>';return}
  b.textContent='⏳ …';
  try{var lk=await sb.rpc('student_lookup',{p_id:id});if(lk.error)throw lk.error;if(!lk.data){b.innerHTML='<span style="color:#dc2626">❌ هذا الـ ID غير مسجل</span>';return}
    var q=await sb.rpc('student_results',{p_id:id});if(q.error)throw q.error;var L=q.data||[];
    b.innerHTML='<b>'+esc(lk.data.n)+'</b> - '+esc(lk.data.g)+(L.length?'<table style="margin-top:8px">'+L.map(function(r){return'<tr><td>'+esc(r.s)+'</td><td dir="ltr">'+esc(r.t)+' / '+esc(r.m)+'</td></tr>'}).join('')+'</table>':'<p>لا توجد نتيجة معتمدة بعد. ستظهر هنا بعد اعتماد الدكتور.</p>')}
  catch(e){b.innerHTML='<span style="color:#dc2626">⚠ تعذّر الاتصال، حاول مرة أخرى</span>'}}

/* ===== student draft auto-save (male students: fixed scenario, so a draft always matches the sheet) ===== */
function draftKey(){try{return(st&&st.id&&st.s&&st.sx=='m')?'draft|'+st.id+'|'+st.s:null}catch(e){return null}}
function draftCollect(){var S=SH[st.s],d={v:1,t:Date.now(),f:{},h:{},cp:[],m:null,tx:null,phi:[]};
  S.f.forEach(function(f,i){if(f.t=='h')return;var e=document.getElementById('f'+i);if(!e)return;d.f[i]=f.t=='k'?(e.checked?1:0):e.value});
  S.he.forEach(function(h,i){var e=document.getElementById('h'+i);if(e)d.h[i]=e.value});
  d.cp=[].map.call(document.querySelectorAll('#cpb tr'),function(r){return[].map.call(r.querySelectorAll('textarea'),function(t){return t.value})});
  if(st.s=='lab'){d.m=marks;d.tx=tx;d.phi=[].map.call(document.querySelectorAll('.phi'),function(i){return i.value})}
  return d}
function draftHasData(d){return Object.keys(d.f).some(function(k){return d.f[k]&&String(d.f[k]).trim()})||Object.keys(d.h).some(function(k){return String(d.h[k]).trim()})||d.cp.some(function(r){return r.some(function(x){return String(x).trim()})})||(d.m&&d.m.length)||(d.phi||[]).some(function(x){return String(x).trim()})}
function draftSave(){var k=draftKey();if(!k||!document.getElementById('cpb')||window._finBusy)return;try{var d=draftCollect();if(draftHasData(d))localStorage.setItem(k,JSON.stringify(d))}catch(e){}}
function draftClear(U,k){try{if(U&&U.id&&k)localStorage.removeItem('draft|'+U.id+'|'+k)}catch(e){}}
function draftReset(){var k=draftKey();try{k&&localStorage.removeItem(k)}catch(e){}location.reload()}
function draftRestore(){var k=draftKey();if(!k||!document.getElementById('cpb'))return;var raw=null;try{raw=localStorage.getItem(k)}catch(e){}if(!raw)return;
  var d;try{d=JSON.parse(raw)}catch(e){return}if(!d||d.v!=1||Date.now()-d.t>7*864e5)return;
  var S=SH[st.s];
  S.f.forEach(function(f,i){if(f.t=='h'||d.f[i]==null)return;var e=document.getElementById('f'+i);if(!e)return;if(f.t=='k')e.checked=!!d.f[i];else e.value=d.f[i]});
  S.he.forEach(function(h,i){var e=document.getElementById('h'+i);if(e&&d.h[i]!=null)e.value=d.h[i]});
  var need=(d.cp||[]).length;while(document.querySelectorAll('#cpb tr').length<need&&window.addRow)window.addRow();
  [].forEach.call(document.querySelectorAll('#cpb tr'),function(r,i){var a=r.querySelectorAll('textarea');(d.cp[i]||[]).forEach(function(v,j){if(a[j])a[j].value=v})});
  if(st.s=='lab'){if(d.m)marks=d.m;if(d.tx)tx=d.tx;[].forEach.call(document.querySelectorAll('.phi'),function(i,n){if(d.phi&&d.phi[n]!=null)i.value=d.phi[n]});try{draw()}catch(e){}}
  var all=[].slice.call(document.querySelectorAll('#app input,#app select,#app textarea'));
  all.forEach(function(e){if(e.type!='checkbox')e.classList.toggle('ok',!!String(e.value).trim())});
  try{pb(all.filter(function(q){return q.value.trim()}).length/Math.max(1,all.length)*100)}catch(e){}
  var a=document.getElementById('app');if(a&&!document.getElementById('draftbn'))a.insertAdjacentHTML('afterbegin','<div id="draftbn" dir="rtl" style="margin:8px 0;padding:10px 14px;border-radius:10px;background:#dcfce7;color:#14532d;border:2px solid #16a34a;font-weight:600">✔ تم استرجاع إجاباتك المحفوظة تلقائياً. <button class="g" style="width:auto;padding:3px 10px" onclick="if(confirm(\'مسح كل الإجابات والبدء من جديد؟\'))draftReset()">ابدأ من جديد</button></div>')}
(function(){var _tsC=toSheet;toSheet=async function(){var r=await _tsC.apply(this,arguments);try{draftRestore()}catch(e){console.warn('draft restore',e)}return r};
  var q=function(){clearTimeout(window._dT);window._dT=setTimeout(draftSave,1500)};
  document.addEventListener('input',q,true);document.addEventListener('change',q,true);
  setInterval(draftSave,8000);addEventListener('pagehide',draftSave);
  document.addEventListener('visibilitychange',function(){if(document.hidden)draftSave()});
  addEventListener('beforeunload',function(e){if(draftKey()&&document.getElementById('cpb')&&!window._finBusy){draftSave();e.preventDefault();e.returnValue=''}});
})();
</script>
